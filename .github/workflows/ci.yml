name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Windows: es la plataforma del proyecto (el lanzador web del rastreo usa msvcrt).
    name: Backend (Django + PostgreSQL 16, Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      DJANGO_SETTINGS_MODULE: config.settings_ci
      DJANGO_SECRET_KEY: clave-ficticia-solo-para-pruebas-de-ci-no-usar-en-produccion
      # Mismos hosts que la configuración local (las pruebas del proxy usan 127.0.0.1).
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      # Credenciales de una base efímera de CI, solo para pruebas.
      PG_ADMIN_PASSWORD: solo-ci-no-es-secreto
      DB_NAME: postgres
      DB_USER: becanexo_ci
      DB_PASSWORD: solo-ci-no-es-secreto
      DB_HOST: localhost
      DB_PORT: "5432"
      AVISOS_CORREO_HABILITADOS: "False"
      RASTREO_EXTRAORDINARIO_HABILITADO: "False"
      RASTREO_BORRADORES_AUTOMATICOS_HABILITADOS: "False"
      RASTREO_CANDIDATO_PDF_HABILITADO: "False"
      PYTHONIOENCODING: utf-8
    steps:
      # Sin conversión a CRLF: las pruebas comparan las huellas de los fixtures con sus bytes del repositorio.
      - name: Conservar los finales de línea del repositorio
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Instalar PostgreSQL 16
        run: |
          # El runner trae otra versión detenida; se instala la 16 y se usa su servicio en el puerto 5432.
          Get-Service -Name 'postgresql*' -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue
          choco install postgresql16 --no-progress -y --params "/Password:$env:PG_ADMIN_PASSWORD /Port:5432"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = 'C:\Program Files\PostgreSQL\16\bin'
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          $env:PGPASSWORD = $env:PG_ADMIN_PASSWORD
          for ($i = 0; $i -lt 30; $i++) { & "$bin\pg_isready.exe" -h localhost -p 5432 -U postgres; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep -Seconds 2 }
          & "$bin\psql.exe" -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "SELECT version();"
          & "$bin\psql.exe" -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE $env:DB_USER LOGIN CREATEDB PASSWORD '$env:DB_PASSWORD';"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r backend/requirements.txt

      - name: Preparar almacén documental temporal
        run: |
          $ruta = Join-Path $env:RUNNER_TEMP 'rastreo'
          New-Item -ItemType Directory -Force -Path $ruta | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "RASTREO_STORAGE_ROOT_PRUEBAS=$ruta"

      # Modelo ONNX de afinidad semántica: los mismos artefactos fijados y verificados que en local.
      - name: Caché del modelo semántico
        id: modelo
        uses: actions/cache@v6
        with:
          path: .local-models/miniLM-multilingual
          key: modelo-onnx-${{ runner.os }}-${{ hashFiles('backend/scripts/download_semantic_model.py') }}

      - name: Descargar el modelo semántico
        if: steps.modelo.outputs.cache-hit != 'true'
        run: python backend/scripts/download_semantic_model.py

      - name: Comprobación de Django
        working-directory: backend
        run: python manage.py check

      - name: Migraciones al día
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Pruebas del backend
        working-directory: backend
        run: python manage.py test --noinput

  frontend:
    name: Frontend (lint, Vitest y build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --maxWorkers=2
      - run: npm run build
