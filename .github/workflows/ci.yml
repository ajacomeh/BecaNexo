name: CI

# Un PR se valida una sola vez (evento pull_request); main se verifica completo tras cada merge; también a mano.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# En un PR, una subida nueva cancela la ejecución anterior del mismo PR. Fuera de los PR (main y ejecución manual)
# cada ejecución tiene su propio grupo: nunca se cancela ni se descarta mientras espera.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide qué jobs necesita un PR según los archivos cambiados. En push a main y en ejecución manual, o si el diff
  # no se puede calcular, se ejecutan ambos. Un job no necesario aparece como «skipped», no como fallo.
  cambios:
    name: Detectar cambios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.rutas.outputs.backend }}
      frontend: ${{ steps.rutas.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Clasificar los archivos cambiados
        id: rutas
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          CABEZA: ${{ github.event.pull_request.head.sha }}
        run: |
          emitir() {
            echo "backend=$1" >> "$GITHUB_OUTPUT"
            echo "frontend=$2" >> "$GITHUB_OUTPUT"
            echo "Backend: $1 · Frontend: $2 · Motivo: $3" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          if [ "$EVENTO" != "pull_request" ]; then emitir true true "evento $EVENTO: verificación completa"; exit 0; fi
          if [ -z "$BASE" ] || [ -z "$CABEZA" ] || ! archivos=$(git diff --name-only "$BASE...$CABEZA"); then
            emitir true true "no se pudo calcular el diff del PR"; exit 0
          fi
          if [ -z "$archivos" ]; then emitir true true "diff vacío"; exit 0; fi
          backend=false
          frontend=false
          while IFS= read -r archivo; do
            case "$archivo" in
              .github/workflows/*) backend=true; frontend=true ;;
              backend/*|requirements*|*/requirements*|.python-version|pyproject.toml|setup.cfg|*.sql) backend=true ;;
              frontend/*) frontend=true ;;
              docs/*|*.md) ;;  # solo documentación
              *) backend=true; frontend=true ;;  # ruta no reconocida: verificación completa por seguridad
            esac
          done <<< "$archivos"
          printf '%s\n' "$archivos" | sed 's/^/  - /'
          emitir "$backend" "$frontend" "$(printf '%s\n' "$archivos" | wc -l) archivo(s) cambiado(s)"

  backend:
    # Windows: es la plataforma del proyecto (el lanzador web del rastreo usa msvcrt).
    name: Backend (Django + PostgreSQL 16, Windows)
    needs: cambios
    # Se ejecuta si lo pide «cambios» o si «cambios» no terminó bien (por seguridad, nunca se omite sin decisión).
    if: ${{ !cancelled() && (needs.cambios.result != 'success' || needs.cambios.outputs.backend == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      DJANGO_SETTINGS_MODULE: config.settings_ci
      DJANGO_SECRET_KEY: clave-ficticia-solo-para-pruebas-de-ci-no-usar-en-produccion
      # Mismos hosts que la configuración local (las pruebas del proxy usan 127.0.0.1).
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      # Credenciales de una base efímera de CI, solo para pruebas.
      PG_ADMIN_PASSWORD: solo-ci-no-es-secreto
      DB_NAME: postgres
      DB_USER: becanexo_ci
      DB_PASSWORD: solo-ci-no-es-secreto
      DB_HOST: localhost
      DB_PORT: "5432"
      AVISOS_CORREO_HABILITADOS: "False"
      RASTREO_EXTRAORDINARIO_HABILITADO: "False"
      RASTREO_BORRADORES_AUTOMATICOS_HABILITADOS: "False"
      RASTREO_CANDIDATO_PDF_HABILITADO: "False"
      PYTHONIOENCODING: utf-8
    steps:
      # Sin conversión a CRLF: las pruebas comparan las huellas de los fixtures con sus bytes del repositorio.
      - name: Conservar los finales de línea del repositorio
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Instalar PostgreSQL 16
        run: |
          # El runner trae otra versión detenida; se instala la 16 y se usa su servicio en el puerto 5432.
          Get-Service -Name 'postgresql*' -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue
          choco install postgresql16 --no-progress -y --params "/Password:$env:PG_ADMIN_PASSWORD /Port:5432"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = 'C:\Program Files\PostgreSQL\16\bin'
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          $env:PGPASSWORD = $env:PG_ADMIN_PASSWORD
          for ($i = 0; $i -lt 30; $i++) { & "$bin\pg_isready.exe" -h localhost -p 5432 -U postgres; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep -Seconds 2 }
          & "$bin\psql.exe" -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "SELECT version();"
          & "$bin\psql.exe" -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE $env:DB_USER LOGIN CREATEDB PASSWORD '$env:DB_PASSWORD';"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r backend/requirements.txt

      - name: Preparar almacén documental temporal
        run: |
          $ruta = Join-Path $env:RUNNER_TEMP 'rastreo'
          New-Item -ItemType Directory -Force -Path $ruta | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "RASTREO_STORAGE_ROOT_PRUEBAS=$ruta"

      # Modelo ONNX de afinidad semántica: los mismos artefactos fijados y verificados que en local.
      - name: Caché del modelo semántico
        id: modelo
        uses: actions/cache@v6
        with:
          path: .local-models/miniLM-multilingual
          key: modelo-onnx-${{ runner.os }}-${{ hashFiles('backend/scripts/download_semantic_model.py') }}

      - name: Descargar el modelo semántico
        if: steps.modelo.outputs.cache-hit != 'true'
        run: python backend/scripts/download_semantic_model.py

      - name: Comprobación de Django
        working-directory: backend
        run: python manage.py check

      - name: Migraciones al día
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Pruebas del backend
        working-directory: backend
        run: python manage.py test --noinput

  frontend:
    name: Frontend (lint, Vitest y build)
    needs: cambios
    if: ${{ !cancelled() && (needs.cambios.result != 'success' || needs.cambios.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --maxWorkers=2
      - run: npm run build
